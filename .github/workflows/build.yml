name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    env:
      TEMP: ${{ github.workspace }}\target\tmp
      TMP: ${{ github.workspace }}\target\tmp
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare temporary directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path $env:TEMP -Force | Out-Null
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build production bridge
        shell: cmd
        run: bgi-bridge\build.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: pudding-bgi-win-x64
          path: target/bridge/
          if-no-files-found: error
